<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Identity Verification</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Sumsub Web SDK Script --> 
<script src="https://static.sumsub.com/idensic/static/sns-websdk-builder.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 antialiased text-slate-800">

  <!-- Main Container Card -->
  <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl border border-slate-100 p-6 sm:p-8">
    
    <!-- Header Section -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-blue-50 text-blue-600 mb-4">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Identity Verification</h2>
      <p class="text-sm text-slate-500 mt-1">Complete the quick verification process below to secure your account.</p>
    </div>

    <!-- Loading Spinner State -->
    <div id="loading-spinner" class="flex flex-col items-center justify-center py-12 space-y-3">
      <div class="w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-sm font-medium text-slate-600">Initializing secure session...</p>
    </div>

    <!-- Sumsub SDK Mount Target -->
    <div id="sumsub-websdk-container" class="w-full min-h-[450px]"></div>

  </div>

  <script>
    // ========================================================
    // MANUAL BEARER TOKEN (Add your authorization token here)
    // ========================================================
    const BEARER_TOKEN = 'oat_MzI.OFJZVDFTOU9telJJaUxwbndJN3kyQ1BPS3RocU9SXy1lNG9pVW5pVDM1Mjk0MDY3MzA';

    /**
     * Fetch access token from your AdonisJS API endpoint
     */
    async function getSumsubAccessToken() {
      try {
        const response = await fetch('http://localhost:3333/api/v1/account/compliance/sumsub_token', {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${BEARER_TOKEN}`
          }
        });

        if (!response.ok) {
          throw new Error(`Server returned status: ${response.status}`);
        }

        const data = await response.json();
        return data.token; // Expecting { token: "sbx:xxx..." }
      } catch (error) {
        console.error('Failed to fetch Sumsub access token:', error);
        
        const spinner = document.getElementById('loading-spinner');
        if (spinner) {
          spinner.innerHTML = `
            <div class="text-center p-4 bg-red-50 border border-red-100 rounded-xl">
              <p class="text-sm font-semibold text-red-600">Failed to load verification session.</p>
              <p class="text-xs text-red-500 mt-1">Please check your authorization token or try again.</p>
            </div>
          `;
        }
        return null;
      }
    }

    /**
     * Launch Sumsub Web SDK
     */
    /**
 * Launch Sumsub Web SDK (v2 API syntax)
 */
async function initSumsubSDK() {
  const accessToken = await getSumsubAccessToken();

  if (!accessToken) return;

  // Hide loading spinner once token is retrieved successfully
  const spinner = document.getElementById('loading-spinner');
  if (spinner) spinner.style.display = 'none';

  // Build and launch the Sumsub SDK instance
  const snsWebSdkInstance = snsWebSdk
    .init(
      accessToken,
      // Token refresh callback if the current session token expires
      async () => {
        console.log('Refreshing expired Sumsub token...');
        return await getSumsubAccessToken();
      }
    )
    .withConf({
      lang: 'en',
      uiConf: {
        customCssStr: ':root { --sns-color-primary: #2563eb; }' // Tailwind Blue-600
      }
    })
    .withOptions({ 
      addViewportTag: false, 
      adaptIframeHeight: true 
    })
    .on('applicantSubmitted', (payload) => {
      console.log('Applicant submitted documents:', payload);
    })
    .on('actionResult', (result) => {
      console.log('Verification action result:', result);

      if (result.reviewStatus === 'completed' && result.reviewResult?.reviewAnswer === 'GREEN') {
        console.log('Identity verified successfully!');
        window.location.href = '/compliance/success';
      }
    })
    // In WebSDK 2.0, errors are listened to via .on('error', handler)
    .on('error', (error) => {
      console.error('Sumsub WebSDK Error:', error);
    })
    .build();

  // Mount into the container
  snsWebSdkInstance.launch('#sumsub-websdk-container');
}
 

    // Initialize SDK on page load
    document.addEventListener('DOMContentLoaded', initSumsubSDK);
  </script>

</body>
</html>
